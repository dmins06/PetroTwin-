name: PVOIL API Read-only Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pvoil-api-check:
    name: Validate PVOIL via VietFuel API
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install collector dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[collectors]"

      - name: Check VietFuel API
        run: python -m petrotwin.collectors.domestic_fuel --check-only
