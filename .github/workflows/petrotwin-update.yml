name: PetroTwin Event-Driven Data Update
run-name: "PetroTwin Update [${{ github.event.client_payload.dispatch_id || github.event.client_payload.change_bundle_id || github.event_name }}]"

on:
  workflow_dispatch:
  repository_dispatch:
    types:
      - petrotwin_new_data

permissions:
  contents: write

concurrency:
  group: petrotwin-data-update
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      TARGET_BRANCH: main
      PETROTWIN_DB_HOST: ${{ vars.PETROTWIN_DB_HOST }}
      PETROTWIN_DB_PORT: ${{ vars.PETROTWIN_DB_PORT || '4000' }}
      PETROTWIN_DB_NAME: ${{ vars.PETROTWIN_DB_NAME || 'petrotwin' }}
      PETROTWIN_DB_USER: ${{ vars.PETROTWIN_DB_USER }}
      PETROTWIN_DB_PASSWORD: ${{ secrets.PETROTWIN_DB_PASSWORD }}
      PETROTWIN_DB_SSL: "true"

    steps:
      - name: Log and validate trigger context
        shell: bash
        env:
          CHANGED_SOURCES: ${{ toJSON(github.event.client_payload.changed_sources) }}
          CHANGE_BUNDLE_ID: ${{ github.event.client_payload.change_bundle_id }}
        run: |
          set -euo pipefail
          echo "event_name=${GITHUB_EVENT_NAME}"
          echo "event_action=${GITHUB_EVENT_ACTION:-manual}"
          echo "change_bundle_id=${CHANGE_BUNDLE_ID:-manual}"
          echo "changed_sources=${CHANGED_SOURCES:-[]}"
          if [ "${GITHUB_EVENT_NAME}" = "repository_dispatch" ]; then
            python3 - <<'PY'
          import json, os, sys
          allowed = {"brent", "fx", "domestic_fuel"}
          raw = os.environ.get("CHANGED_SOURCES", "[]")
          sources = json.loads(raw) if raw and raw != "null" else []
          if not isinstance(sources, list) or not sources:
              print("::error::repository_dispatch requires non-empty changed_sources", file=sys.stderr)
              sys.exit(1)
          unknown = set(sources) - allowed
          if unknown:
              print(f"::error::Unknown changed_sources in dispatch payload: {sorted(unknown)}", file=sys.stderr)
              sys.exit(1)
          PY
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[collectors,mysql]"

      - name: Validate database configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PETROTWIN_DB_HOST" || {
            echo "::error::Missing repository variable PETROTWIN_DB_HOST"
            exit 1
          }
          test -n "$PETROTWIN_DB_USER" || {
            echo "::error::Missing repository variable PETROTWIN_DB_USER"
            exit 1
          }
          test -n "$PETROTWIN_DB_PASSWORD" || {
            echo "::error::Missing repository secret PETROTWIN_DB_PASSWORD"
            exit 1
          }

      - name: Run T14 collection and database publishing
        run: python -m petrotwin.collectors.runner

      - name: Commit updated tracked raw data
        shell: bash
        run: |
          set -euo pipefail
          git add -u -- 'data/raw/*.csv'

          if git diff --cached --quiet; then
            echo "No tracked raw CSV changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "data: update market datasets (event-driven)"
          git push origin "HEAD:${TARGET_BRANCH}"

      - name: Confirm published dispatch state
        if: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.dispatch_id != '' }}
        shell: bash
        env:
          PYTHONPATH: src
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_DISPATCH_TOKEN: ${{ secrets.GITHUB_DISPATCH_TOKEN }}
          DISPATCH_ID: ${{ github.event.client_payload.dispatch_id }}
        run: |
          set -euo pipefail
          if [ -z "${GITHUB_DISPATCH_TOKEN:-}" ]; then
            echo "GITHUB_DISPATCH_TOKEN not set; state/detector will be reconciled by petrotwin-detect.yml."
            exit 0
          fi
          python -m petrotwin.collectors.change_detector \
            --state-backend github \
            --state-branch state/detector \
            --confirm-dispatch-id "${DISPATCH_ID}"
