name: PetroTwin Data Change Detector

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: petrotwin-data-detect
  cancel-in-progress: false

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            src/petrotwin
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lightweight detector dependencies
        run: python -m pip install --no-cache-dir requests beautifulsoup4 PyYAML

      - name: Validate detector token configuration
        shell: bash
        env:
          PETROTWIN_DISPATCH_TOKEN: ${{ secrets.PETROTWIN_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PETROTWIN_DISPATCH_TOKEN" || {
            echo "::error::Missing repository secret PETROTWIN_DISPATCH_TOKEN (requires Contents: Read/Write and Actions: Read)"
            exit 1
          }

      - name: Detect upstream source changes and dispatch if new
        shell: bash
        env:
          PYTHONPATH: src
          GITHUB_REPOSITORY: ${{ github.repository }}
          PETROTWIN_DISPATCH_TOKEN: ${{ secrets.PETROTWIN_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          python -m petrotwin.collectors.change_detector \
            --state-backend github \
            --state-branch state/detector \
            --dispatch
