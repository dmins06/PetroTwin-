services:
  workspace:
    image: mcr.microsoft.com/devcontainers/python:1-3.11-bookworm
    command: sleep infinity
    env_file:
      - .mysql.env
    volumes:
      - ..:/workspaces/${localWorkspaceFolderBasename}:cached
    depends_on:
      - mysql

  mysql:
    image: mysql:26.10
    env_file:
      - .mysql.env
    environment:
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: petrotwin
    volumes:
      - mysql-data-v2:/var/lib/mysql
    expose:
      - "3306"

volumes:
  mysql-data-v2:
